name: CI SOL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cola FIFO por referencia: hasta 100 ejecuciones pendientes. Si la cola se
# llena, las adicionales se cancelan; no se cancela la ejecución en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  php:
    name: PHP (sintaxis, PHPUnit y configuración)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar entorno sintético
        run: bash .github/scripts/prepare-ci-env.sh

      - name: Sintaxis de todos los archivos PHP
        run: |
          mkdir -p artifacts/php
          set -o pipefail
          ./deploy/scripts/test.sh php-lint 2>&1 | tee artifacts/php/php-lint.log

      - name: Validación preventiva y contexto Docker
        run: |
          set -o pipefail
          ./deploy/scripts/test.sh validation 2>&1 | tee artifacts/php/validation.log

      - name: Preconstruir imágenes con reintentos de registry
        run: |
          mkdir -p artifacts/php
          set -o pipefail
          ./deploy/scripts/dev.sh build 2>&1 | tee artifacts/php/docker-build.log

      - name: PHPUnit
        run: |
          set -o pipefail
          ./deploy/scripts/test.sh backend --no-build 2>&1 | tee artifacts/php/phpunit.log

      - name: Publicar evidencias PHP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: php-logs
          path: artifacts/php
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (tests, lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar entorno sintético
        run: bash .github/scripts/prepare-ci-env.sh

      - name: Preconstruir imágenes con reintentos de registry
        run: |
          mkdir -p artifacts/frontend
          set -o pipefail
          ./deploy/scripts/dev.sh build 2>&1 | tee artifacts/frontend/docker-build.log

      - name: Tests, lint y build
        run: |
          mkdir -p artifacts/frontend
          set -o pipefail
          ./deploy/scripts/test.sh frontend --no-build 2>&1 | tee artifacts/frontend/frontend.log

      - name: Publicar evidencias frontend
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: frontend-logs
          path: artifacts/frontend
          if-no-files-found: ignore
          retention-days: 7

  mariadb:
    name: MariaDB (migraciones, seeds y auditoría)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar entorno sintético
        run: bash .github/scripts/prepare-ci-env.sh

      - name: Levantar MariaDB 11.4.13
        run: |
          mkdir -p artifacts/mariadb
          set -o pipefail
          ./deploy/scripts/dev.sh up 2>&1 | tee artifacts/mariadb/up.log

      - name: Aplicar migraciones desde cero
        run: |
          set -o pipefail
          ./deploy/scripts/dev.sh migrate 2>&1 | tee artifacts/mariadb/migrate.log

      - name: Cargar datos de prueba
        run: |
          set -o pipefail
          ./deploy/scripts/dev.sh seed DatosPruebaSeeder --yes 2>&1 | tee artifacts/mariadb/seed.log

      - name: Auditoría de integridad
        run: |
          set -o pipefail
          ./deploy/scripts/test.sh audit 2>&1 | tee artifacts/mariadb/audit.log

      - name: Smoke HTTP
        run: |
          set -o pipefail
          ./deploy/scripts/test.sh http 2>&1 | tee artifacts/mariadb/http.log

      - name: Compatibilidad MariaDB
        run: |
          set -o pipefail
          ./deploy/scripts/smoke.sh test_mariadb_compat.sh 2>&1 | tee artifacts/mariadb/compat.log

      - name: Detener stack
        if: always()
        run: ./deploy/scripts/dev.sh down

      - name: Publicar evidencias MariaDB
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: mariadb-logs
          path: artifacts/mariadb
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Compatibilidad MySQL 8.0 -> MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar entorno sintético
        run: bash .github/scripts/prepare-ci-env.sh

      - name: Importar y comparar 28 tablas
        run: |
          mkdir -p artifacts/compatibility
          set -o pipefail
          COMPAT_ARTIFACTS="$PWD/artifacts/compatibility" \
            ./deploy/scripts/test.sh compatibility 2>&1 | tee artifacts/compatibility/compatibility.log

      - name: Publicar evidencias de comparación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: compatibility-evidence
          path: artifacts/compatibility
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Smoke (29 suites)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar entorno sintético
        run: bash .github/scripts/prepare-ci-env.sh

      - name: Smoke completo aislado
        run: |
          mkdir -p artifacts/smoke
          set -o pipefail
          ./deploy/scripts/test.sh smoke 2>&1 | tee artifacts/smoke/smoke.log

      - name: Publicar evidencias smoke
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: smoke-logs
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (Chromium Headless)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar entorno sintético
        run: bash .github/scripts/prepare-ci-env.sh

      - name: Inicializar instalación nueva (bootstrap)
        run: |
          mkdir -p artifacts/e2e
          set -o pipefail
          ./deploy/scripts/bootstrap.sh --dev --authorize 2>&1 | tee artifacts/e2e/bootstrap.log

      - name: Sembrar fixtures de prueba
        run: |
          set -o pipefail
          ./deploy/scripts/dev.sh seed DatosPruebaSeeder --yes 2>&1 | tee artifacts/e2e/seed.log

      - name: Verificar catálogo de referencia
        run: |
          set -o pipefail
          curl -fsS http://localhost:8080/api/categorias | tee artifacts/e2e/categorias.json >/dev/null
          python3 - <<'PY'
          import json

          with open('artifacts/e2e/categorias.json', encoding='utf-8') as archivo:
              cuerpo = json.load(archivo)

          assert cuerpo.get('success') is True, cuerpo
          datos = cuerpo.get('data')
          assert isinstance(datos, list) and datos, 'el catálogo de categorías está vacío'

          construccion = next((item for item in datos if item.get('nombre') == 'Construcción'), None)
          assert construccion is not None, 'falta la categoría Construcción (SystemSeeder no se ejecutó)'
          assert str(construccion.get('activo')) in ('1', 'true', 'True'), construccion

          print(f'OK catálogo de referencia: {len(datos)} categorías; Construcción activa.')
          PY

      - name: E2E lectura y escritura
        env:
          E2E_ADMIN_USER: ci-admin
          E2E_ADMIN_PASS: CiAdmin123!
        run: |
          set -o pipefail
          E2E_WRITES=1 E2E_ARTIFACTS="$PWD/artifacts/e2e" \
            ./deploy/scripts/test.sh e2e 2>&1 | tee artifacts/e2e/e2e.log

      - name: Detener stack
        if: always()
        run: ./deploy/scripts/dev.sh down

      - name: Publicar evidencias E2E
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: e2e-evidence
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI Validación global
    runs-on: ubuntu-latest
    if: always()
    needs: [php, frontend, mariadb, compatibility, smoke, e2e]
    steps:
      - name: Verificar jobs obligatorios
        env:
          RESULT_PHP: ${{ needs.php.result }}
          RESULT_FRONTEND: ${{ needs.frontend.result }}
          RESULT_MARIADB: ${{ needs.mariadb.result }}
          RESULT_COMPATIBILITY: ${{ needs.compatibility.result }}
          RESULT_SMOKE: ${{ needs.smoke.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
        run: |
          fallos=0
          for par in \
            "php:$RESULT_PHP" \
            "frontend:$RESULT_FRONTEND" \
            "mariadb:$RESULT_MARIADB" \
            "compatibility:$RESULT_COMPATIBILITY" \
            "smoke:$RESULT_SMOKE" \
            "e2e:$RESULT_E2E"; do
            nombre=${par%%:*}
            resultado=${par#*:}
            printf '%-16s %s\n' "$nombre" "$resultado"
            if [ "$resultado" != "success" ]; then
              echo "::error::El job obligatorio '$nombre' terminó como '$resultado'."
              fallos=$((fallos + 1))
            fi
          done

          {
            echo "## Resultado CI SOL"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| PHP | $RESULT_PHP |"
            echo "| Frontend | $RESULT_FRONTEND |"
            echo "| MariaDB | $RESULT_MARIADB |"
            echo "| Compatibilidad | $RESULT_COMPATIBILITY |"
            echo "| Smoke | $RESULT_SMOKE |"
            echo "| E2E | $RESULT_E2E |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fallos" -gt 0 ]; then
            echo "::error::$fallos job(s) obligatorio(s) no finalizaron correctamente."
            exit 1
          fi
