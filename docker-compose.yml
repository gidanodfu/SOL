services:
  mysql:
    image: mysql:8.0
    container_name: empleo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_empleo
      MYSQL_USER: empleo
      MYSQL_PASSWORD: empleo123
    ports:
      - "3306:3306"
    volumes:
      - empleo_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  adminer:
    image: adminer:latest
    container_name: empleo_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - mysql

volumes:
  empleo_mysql_data:
