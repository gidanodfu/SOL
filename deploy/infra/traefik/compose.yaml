name: ${TRAEFIK_PROJECT_NAME:-sol_infra}

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    restart: unless-stopped
    environment:
      # API de solo lectura para el proveedor Docker de Traefik.
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      VERSION: "1"
      PING: "1"
      INFO: "1"
      SERVICES: "1"
      TASKS: "1"
      NODES: "1"
      IMAGES: "0"
      VOLUMES: "0"
      POST: "0"
      DELETE: "0"
      EXEC: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
      CONFIG: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - socket
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    depends_on:
      - socket-proxy
    entrypoint:
      - /entrypoint.sh
    command:
      - --configFile=/tmp/traefik.rendered.yml
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL en deploy/infra/traefik/.env}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      PROXY_NETWORK: ${PROXY_NETWORK:-proxy}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml.template:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/acme
    security_opt:
      - no-new-privileges:true
    labels:
      com.sol.infra: traefik
    networks:
      proxy:
      socket:
      sol_entry:
        ipv4_address: ${TRAEFIK_ENTRY_IP:-172.31.0.2}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  traefik_acme:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
  socket:
    name: ${TRAEFIK_SOCKET_NETWORK:-traefik_socket}
    driver: bridge
    internal: true
  sol_entry:
    name: ${SOL_ENTRY_NETWORK:-sol_entry}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SOL_ENTRY_SUBNET:-172.31.0.0/29}
