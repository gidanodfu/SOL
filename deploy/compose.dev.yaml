services:
  db:
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3307}:3306"

  backend:
    build:
      target: dev
    command: ["php", "spark", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8080}:8080"
    environment:
      CI_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - ../backend/app:/var/www/sol/backend/app
      - ../backend/public:/var/www/sol/backend/public
      - ../backend/tests:/var/www/sol/backend/tests
      - ../backend/phpunit.dist.xml:/var/www/sol/backend/phpunit.dist.xml:ro
      - backend_writable:/var/www/sol/backend/writable
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    environment:
      SOL_VITE_ENV_DIR: "false"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/vite.config.js:/app/vite.config.js:ro
      - ../frontend/package.json:/app/package.json:ro
      # Solo para la prueba estática que compara la versión de términos con backend.
      - ../backend/app/Libraries/Terminos.php:/backend/app/Libraries/Terminos.php:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${DEV_ADMINER_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
