services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      NGINX_MODE: ${NGINX_MODE:-same-domain}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    volumes:
      - ./nginx/templates:/etc/nginx/templates-sol:ro
      - ./nginx/render.sh:/docker-entrypoint.d/40-render-sol.sh:ro
      - nginx_conf:/etc/nginx/conf.d
      - ${TLS_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  nginx_conf:
