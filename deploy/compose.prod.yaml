services:
  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Sin ports: Traefik es el único servicio que publica 80/443.
    expose:
      - "80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      # Traefik termina TLS y habla HTTP con este Nginx interno.
      NGINX_MODE: http
      PROXY_SUBNET: ${PROXY_SUBNET:-172.30.0.0/24}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      traefik.http.routers.sol.rule: Host(`${APP_DOMAIN}`) || Host(`${API_DOMAIN}`)
      traefik.http.routers.sol.entrypoints: websecure
      traefik.http.routers.sol.tls: "true"
      traefik.http.routers.sol.tls.certresolver: letsencrypt
      traefik.http.routers.sol.middlewares: sol-hsts
      traefik.http.routers.sol.service: sol
      traefik.http.services.sol.loadbalancer.server.port: "80"
      traefik.http.middlewares.sol-hsts.headers.stsseconds: "31536000"
      traefik.http.middlewares.sol-hsts.headers.stsincludesubdomains: "true"
      traefik.http.middlewares.sol-hsts.headers.stspreload: "true"
      traefik.http.middlewares.sol-hsts.headers.forcestsheader: "true"
    volumes:
      - ./nginx/templates:/etc/nginx/templates-sol:ro
      - ./nginx/render.sh:/docker-entrypoint.d/40-render-sol.sh:ro
      - nginx_conf:/etc/nginx/conf.d
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - proxy

volumes:
  nginx_conf:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
