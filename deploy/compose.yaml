name: ${COMPOSE_PROJECT_NAME:-sol_dev}

# Stack de desarrollo local. Solo publica puertos en 127.0.0.1.
services:
  db:
    # MariaDB 11.4 LTS: misma familia de protocolo que MySQL, soporte hasta 2029.
    # Volumen independiente: nunca montar aquí el volumen histórico de MySQL.
    image: mariadb:11.4.13
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-America/Lima}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:?Ejecute dev.sh para preparar un entorno de backend filtrado.}
    command: ["php", "spark", "serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      CI_ENVIRONMENT: development
      TZ: ${TZ:-America/Lima}
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8080}:8080"
    volumes:
      - ../backend/app:/var/www/sol/backend/app
      - ../backend/public:/var/www/sol/backend/public
      - ../backend/tests:/var/www/sol/backend/tests
      - ../backend/phpunit.dist.xml:/var/www/sol/backend/phpunit.dist.xml:ro
      - backend_writable:/var/www/sol/backend/writable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      SOL_VITE_ENV_DIR: "false"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../VERSION:/VERSION:ro
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/vite.config.js:/app/vite.config.js:ro
      - ../frontend/package.json:/app/package.json:ro
      # Solo para la prueba estática que compara la versión de términos con backend.
      - ../backend/app/Libraries/Terminos.php:/backend/app/Libraries/Terminos.php:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  adminer:
    image: adminer:5.3.0
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${DEV_ADMINER_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  # Volumen histórico de MySQL 8.0.46. Se conserva intacto y sin uso; no se
  # reutiliza como directorio de datos de MariaDB.
  mysql_data:
  mariadb_data:
  backend_writable:

networks:
  internal:
    driver: bridge
