; Configuración PHP común para los contenedores de SOL.
; Los límites deben coincidir con los máximos validados por la aplicación:
;   - CV: 5 MB
;   - imágenes de perfil/actividad: 8 MB
; Nginx permite 12m para cubrir el sobrecoste de multipart.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10
max_execution_time = 120
max_input_time = 120
default_charset = "UTF-8"
date.timezone = America/Lima
