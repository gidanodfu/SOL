; Ajustes exclusivos de la imagen de producción. El código se copia en la
; imagen y no se modifica en caliente, por lo que OPcache puede validar menos.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
