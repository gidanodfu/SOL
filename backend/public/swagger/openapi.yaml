      tags: [Admin]
      operationId: adminReportesExcel
      summary: Exportar reporte Excel (.xlsx)
      description: |
        Respuesta NO JSON: `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
        con `Content-Disposition: attachment; filename="reporte-empleo[-desde_hasta].xlsx"`.
        Libro de 5 hojas: Resumen, Actividad mensual, Ofertas por estado, Postulaciones por
        estado y Contrataciones. Reutiliza los indicadores del dashboard; la validación del
        rango es la misma (`DashboardService::validarRango`, 422 si es inválido).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Archivo XLSX del reporte.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
