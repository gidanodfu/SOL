  /api/admin/contrataciones:
    get:
      tags: [Admin]
      operationId: adminListarContrataciones
      summary: Listar contrataciones (admin)
      description: |
        Consulta global con filtros opcionales `desde`/`hasta`. **Hallazgo**: aquí los
        rangos NO se validan en formato (a diferencia de dashboard/reportes); un formato
        inválido puede producir error 500. Orden `fecha_contratacion DESC`, tope fijo 300.
        No existe endpoint de detalle.
      security:
