  # ---------------------------------------------------------------
  # EMPRESA — ofertas
  # ---------------------------------------------------------------
  /api/empresa/ofertas:
    get:
      tags: [Empresa]
      operationId: empresaListarOfertas
      summary: Mis ofertas laborales
      description: |
        Lista las ofertas de la empresa de la sesión (sin filtro por estado), ordenadas por
        `updated_at DESC`. Cada fila incluye `habilidades`. No incluye
        `cantidad_postulaciones`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mis ofertas laborales.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mis ofertas laborales.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfertaFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Empresa]
      operationId: empresaCrearOferta
      summary: Crear oferta (borrador)
      description: |
        La oferta nace en estado `borrador` (requiere validación municipal). `vacantes` se
        exige manualmente (≥ 1); `habilidades` puede ser un arreglo de cadenas o una cadena
        CSV separada por comas. Los campos `categoria_id`, `fecha_cierre`, `tipo_empleo`,
        `remuneracion` etc. son opcionales según las reglas descritas.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaBody'
      responses:
        '201':
          description: Oferta guardada en borrador.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Oferta guardada en borrador.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/ofertas/{id}:
    get:
      tags: [Empresa]
      operationId: empresaVerOferta
      summary: Detalle de oferta propia
      description: |
        Detalle con `habilidades` y `cantidad_postulaciones`. Si la oferta pertenece a otra
        empresa responde 404 (mismo mensaje que inexistente). Visible para cualquier estado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detalle de la oferta.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detalle de la oferta.
                  data:
                    $ref: '#/components/schemas/OfertaDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Empresa]
      operationId: empresaActualizarOferta
      summary: Actualizar oferta propia
      description: |
        Solo se permite editar ofertas en estado `borrador` o `rechazada` (si no, 409
        "Solo puede editar ofertas en borrador o rechazadas."). Editar una oferta rechazada
        la regresa a `borrador` y limpia el `motivo_rechazo`. Mismos campos que la creación.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/ofertas/{id}/cerrar:
    put:
      tags: [Empresa]
      operationId: empresaCerrarOferta
      summary: Cerrar oferta publicada
      description: |
        Transición `publicada → cerrada`. Solo ofertas publicadas (si no, 409 "Solo puede
        cerrar una oferta publicada."). No existe cierre automático por vencimiento de
        `fecha_cierre`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # EMPRESA — postulaciones
  # ---------------------------------------------------------------
  /api/empresa/postulaciones:
    get:
      tags: [Empresa]
      operationId: empresaListarPostulaciones
      summary: Postulaciones recibidas
      description: |
        Filtros opcionales combinables: `estado` (validado contra los 6 estados; 422 si no
        válido) y `oferta_id` (solo las postulaciones de esa oferta de la empresa; 422 si
        no es numérico). Incluye postulaciones activas e inactivas (mezcladas), orden:
        pendientes primero y luego `fecha_postulacion DESC`. Tope fijo 300.
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          description: Estado de la postulación (validado en el controlador).
          schema:
            type: string
            enum: [pendiente, en_revision, preseleccionado, contactado, seleccionado, no_seleccionado]
        - name: oferta_id
          in: query
          description: Filtra por la oferta laboral indicada (opcional).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Postulaciones recibidas.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Postulaciones recibidas.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostulacionEmpresaFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    # ---------------------------------------------------------------
    # EMPRESA — contrataciones
    # ---------------------------------------------------------------
  /api/empresa/contrataciones:
    get:
      tags: [Empresa]
      operationId: empresaListarContrataciones
      summary: Contrataciones de la empresa
      description: |
        Contrataciones de la empresa de la sesión, orden `fecha_contratacion DESC`, sin
        límite. No existe endpoint de detalle individual.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contrataciones registradas.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Contrataciones registradas.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContratacionFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Empresa]
      operationId: empresaRegistrarContratacion
      summary: Registrar contratación
      description: |
        Registra la contratación de un candidato. Solo permite postulaciones propias en
        estado `seleccionado`. **Hallazgo**: no verifica `activo` de la postulación (una
        postulación retirada/desactivada también puede contratarse por aquí, aunque el
        listado de opciones sí exige `activo = 1`). Una postulación admite una sola
        contratación (409 si ya existe). Desnormaliza `empresa_id`, `oferta_id` y
        `postulante_id` desde la postulación.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratacionCrearBody'
      responses:
        '201':
          description: Contratación registrada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Contratación registrada. El resultado alimenta los reportes municipales.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/contrataciones/opciones:
    get:
      tags: [Empresa]
      operationId: empresaOpcionesContratacion
      summary: Candidatos seleccionados sin contratación
      description: |
        Postulaciones de la empresa en estado `seleccionado` y `activo = 1` que aún no
        tienen contratación registrada. Sirve de opciones para el alta de contratación.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Postulaciones seleccionadas sin contratación.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Postulaciones seleccionadas sin contratación.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpcionContratacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/contrataciones/{id}:
    put:
      tags: [Empresa]
      operationId: empresaActualizarContratacion
      summary: Actualizar contratación propia
      description: |
        Actualiza los datos de una contratación propia (404 si es de otra empresa). En el
        cuerpo, `postulacion_id` se ignora (el registro conserva la postulación original).
        No puede cambiar la postulación asociada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratacionActualizarBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # POSTULANTE — perfil
  # ---------------------------------------------------------------
  /api/postulante/perfil:
    get:
      tags: [Postulante]
      operationId: postulantePerfil
      summary: Perfil laboral completo
      description: |
        Devuelve los datos del postulante de la sesión más `username`, `email`,
        `user_telefono`, el `cv` activo (o `null`) y `completitud` (requisitos para
        postular: `datos_basicos`, `tiene_cv`, `faltantes` y `completo`). Incluye el
        `object_key` interno del CV (información interna de bajo riesgo). 404 si no
        existe perfil.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil laboral completo.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Perfil laboral completo.
                  data:
                    $ref: '#/components/schemas/PerfilPostulante'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Postulante]
      operationId: postulanteActualizarPerfil
      summary: Actualizar datos básicos del perfil
      description: |
        Actualiza en dos tablas (`postulantes` y `users`) sin transacción. No valida
        unicidad de `email`: si el correo ya pertenece a otro usuario puede producirse un
        error de BD (500). `fecha_nacimiento` con formato `AAAA-MM-DD`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostulantePerfilBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/postulante/dashboard:
    get:
      tags: [Postulante]
      operationId: postulanteDashboard
      summary: Indicadores del perfil
      description: |
        Conteos de postulaciones propias (`activo = 1`), total y si tiene CV activo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indicadores de su perfil.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Indicadores de su perfil.
                  data:
                    $ref: '#/components/schemas/DashboardPostulante'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # POSTULANTE — secciones del perfil
  # ---------------------------------------------------------------
  /api/postulante/cv:
    get:
      tags: [Postulante]
      operationId: postulanteCvIndex
      summary: CV vigente e historial
      description: |
        `vigente` trae el CV activo (o `null`); `historial` lista todas las versiones
        (`version DESC`). Nota: en `historial`, `activo` es booleano y la fecha se llama
        `fecha`; en `vigente` el campo se llama `actualizado` (mismo origen: `updated_at`).

        `limite_mensual` informa el consumo del límite de **4 CV por mes calendario**:
        `{ limite, usados, restantes }`. El conteo se hace en el backend sobre
        `cvs.created_at`, por lo que no puede evadirse desde el frontend.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CV del postulante.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: CV del postulante.
                  data:
                    type: object
                    required: [vigente, historial, limite_mensual]
                    properties:
                      vigente:
                        $ref: '#/components/schemas/CvVigente'
                      historial:
                        type: array
                        items:
                          $ref: '#/components/schemas/CvHistorialItem'
                      limite_mensual:
                        $ref: '#/components/schemas/LimiteMensualCv'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Postulante]
      operationId: postulanteCvSubir
      summary: Subir CV (multipart)
      description: |
        Sube una nueva versión del CV. **Tipo de contenido: `multipart/form-data`**; el
        archivo debe ir en el campo `cv`. Restricciones reales: extensiones `pdf`, `doc`,
        `docx`; MIME `application/pdf`, `application/msword` o
        `application/vnd.openxmlformats-officedocument.wordprocessingml.document`; tamaño
        máximo 5 MB. El nombre del objeto lo genera el servidor. Primero almacena el
        archivo y luego desactiva los CV anteriores (transacción). Respuesta HTTP 201.

        **Límite mensual**: máximo **4 CV por mes calendario** por postulante. El backend
        cuenta las filas de `cvs` con `created_at` del mes en curso; al llegar a 4 responde
        `409` con "Ha alcanzado el límite de 4 CV este mes. Podrá actualizar su CV el
        próximo mes." y no se sube nada. La respuesta incluye `limite_mensual` con el
        consumo actualizado.

        **Rate limit (token bucket)**: 10 tokens por IP con recarga de 1 token cada 360 s
        (`throttle:10,3600`). Tras la ráfaga de 10 responde `429` con `Retry-After` y luego
        habilita 1 solicitud cada 6 min. Este límite de ráfaga es independiente del tope
        mensual de 4 CV.

        `message` de éxito: "CV cargado correctamente." en la primera carga y
        "CV actualizado correctamente." si ya existía un CV vigente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv:
                  type: string
                  format: binary
                  description: Archivo PDF/DOC/DOCX de hasta 5 MB.
      responses:
        '201':
          description: CV cargado correctamente.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: CV cargado correctamente.
                  data:
                    type: object
                    required: [id, version, nombre_original, tamano, limite_mensual]
                    properties:
                      id:
                        type: integer
                      version:
                        type: integer
                      nombre_original:
                        type: string
                      tamano:
                        type: integer
                      limite_mensual:
                        $ref: '#/components/schemas/LimiteMensualCv'
        '400':
          description: El archivo no se recibió correctamente o no se pudo almacenar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            Se alcanzó el límite mensual de CV. Mensaje real: "Ha alcanzado el límite de
            4 CV este mes. Podrá actualizar su CV el próximo mes.".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
              example:
                success: false
                message: Ha alcanzado el límite de 4 CV este mes. Podrá actualizar su CV el próximo mes.
                errors: []
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/postulante/cv/descargar:
    get:
      tags: [Postulante]
      operationId: postulanteCvDescargar
      summary: URL de descarga del CV propio
      description: |
        Genera la URL de descarga del CV vigente:
        * Driver `supabase` (configuración de producción): URL firmada (presigned GET,
          válida 30 min) al bucket privado.
        * Driver `local`: URL interna protegida `.../api/postulante/cv/archivo/{clave}`.
        `data` = `{ "url": string }`. 404 "Aún no ha cargado un CV." si no existe CV activo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: URL de descarga generada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: URL de descarga generada.
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: url
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/postulante/cv/archivo/{archivo}:
    get:
      tags: [Postulante]
      operationId: postulanteCvArchivo
      summary: Descargar CV (driver local)
      description: |
        Sirve el archivo en binario cuando el driver es `local`. `{archivo}` es el
        `object_key` codificado en base64url sin padding. Solo el propietario puede
        descargar. **Con driver `supabase` (producción) este endpoint responde 404**
        (`rutaLocal` es `null`); en ese modo use la URL firmada de `/cv/descargar`.
      security:
        - bearerAuth: []
      parameters:
        - name: archivo
          in: path
          required: true
          description: Clave del objeto en base64url (sin padding).
          schema:
            type: string
      responses:
        '200':
          description: "Archivo binario (PDF/DOC/DOCX). Header `Content-Disposition: attachment`."
          headers:
            Content-Disposition:
              description: attachment; filename="<nombre original>"
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # POSTULANTE — búsqueda de empleo (ofertas publicadas)
  # ---------------------------------------------------------------
  /api/postulante/ofertas:
    get:
      tags: [Postulante]
      operationId: postulanteBuscarOfertas
      summary: Buscar ofertas publicadas
      description: |
        Solo ofertas en estado `publicada` y vigentes (`fecha_cierre` nula o >= hoy).
        Filtros opcionales por categoría, ubicación, formación y experiencia
        (comparaciones `LIKE`). Orden `fecha_publicacion DESC`, tope fijo 200. Cada fila
        incluye `categoria_nombre`, `ruc` y `razon_social`.
      security:
        - bearerAuth: []
      parameters:
        - name: categoria_id
          in: query
          description: Filtro por categoría.
          schema:
            type: integer
        - name: ubicacion
          in: query
          description: Búsqueda en `ubicacion` (LIKE).
          schema:
            type: string
        - name: formacion
          in: query
          description: Búsqueda en `formacion_requerida` (LIKE).
          schema:
            type: string
        - name: experiencia
          in: query
          description: Búsqueda en `experiencia_requerida` (LIKE).
          schema:
            type: string
      responses:
        '200':
          description: Ofertas disponibles.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Ofertas disponibles.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfertaFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/postulante/ofertas/{id}:
    get:
      tags: [Postulante]
      operationId: postulanteVerOferta
      summary: Detalle de oferta publicada
      description: |
        Solo devuelve ofertas en estado `publicada` (si no, 404 "La oferta no está
        disponible."). **Hallazgo**: no valida vigencia, por lo que una oferta vencida no
        aparece en la búsqueda pero sí es accesible por su URL directa. Incluye
        `habilidades`, `cantidad_postulaciones` y `ya_postule` (si el postulante tiene
        perfil y ya postuló activamente).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detalle de la oferta.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detalle de la oferta.
                  data:
                    $ref: '#/components/schemas/OfertaDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # POSTULANTE — postulaciones
  # ---------------------------------------------------------------
  /api/postulante/postulaciones:
    get:
      tags: [Postulante]
      operationId: postulanteListarPostulaciones
      summary: Mis postulaciones
      description: |
        Lista las postulaciones del postulante de la sesión, orden `fecha_postulacion
        DESC`. Incluye tanto activas como retiradas (no filtra por `activo`). Incluye datos
        de la oferta y de la empresa/categoría.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mis postulaciones.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mis postulaciones.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostulacionPostulanteFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Postulante]
      operationId: postulantePostular
      summary: Postular a una oferta
      description: |
        Registra una postulación (`estado = pendiente`, `activo = 1`) si la oferta está
        publicada y vigente y no existe otra postulación activa del postulante a la misma
        oferta (409). Crea la fila de historial inicial. No requiere CV para postular.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oferta_id]
              properties:
                oferta_id:
                  type: integer
                  description: Id de la oferta publicada.
      responses:
        '201':
          description: Postulación registrada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Postulación registrada. La empresa la revisará próximamente.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/postulante/postulaciones/{id}/retirar:
    put:
      tags: [Postulante]
      operationId: postulanteRetirarPostulacion
      summary: Retirar postulación
      description: |
        Retira (desactiva, `activo = 0`) la postulación propia; nunca se elimina. 409 si ya
        está retirada. Después de retirar se permite volver a postular a la misma oferta
        (queda una postulación nueva y la anterior inactiva). HTTP 200 con `data: null`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # EMPRESA — detalle de postulación y CV (declarado tras las rutas
  # genéricas de contrataciones para respetar el orden del archivo de rutas)
  # ---------------------------------------------------------------
  /api/empresa/postulaciones/{id}:
    get:
      tags: [Empresa]
      operationId: empresaVerPostulacion
      summary: Detalle de postulación
      description: |
        Detalle de una postulación de la empresa: datos de la postulación, un resumen de la
        oferta y el **perfil completo del postulante** (incluye su CV). 404 si la
        postulación no pertenece a la empresa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detalle de la postulación.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detalle de la postulación.
                  data:
                    $ref: '#/components/schemas/PostulacionDetalleEmpresa'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/postulaciones/{id}/estado:
    put:
      tags: [Empresa]
      operationId: empresaCambiarEstadoPostulacion
      summary: Cambiar estado de postulación
      description: |
        Cambia el estado según la máquina de transiciones de la empresa:
        `pendiente → en_revision | no_seleccionado`; `en_revision → preseleccionado |
        contactado | no_seleccionado`; `preseleccionado → contactado | seleccionado |
        no_seleccionado`; `contactado → seleccionado | no_seleccionado`;
        `no_seleccionado → en_revision`; `seleccionado` es terminal. 409 si la transición
        no es válida o la postulación está inactiva. Registra en `postulacion_historial`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoPostulacionBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/postulaciones/{id}/activacion:
    put:
      tags: [Empresa]
      operationId: empresaCambiarActivacionPostulacion
      summary: Activar/desactivar postulación
      description: |
        Activa/desactiva la postulación (vista "retirar" desde la empresa) sin cambiar su
        estado. **Importante**: `(bool)` en PHP; envíe booleano nativo (la cadena "false"
        sería interpretada como `true`). No-op si el valor coincide.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivacionBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/postulaciones/{id}/cv:
    get:
      tags: [Empresa]
      operationId: empresaPostulacionCvUrl
      summary: URL de descarga del CV del postulante
      description: |
        Genera la URL (firmada en Supabase o interna en driver local) del CV activo del
        postulante de una postulación propia. 404 si la postulación no es de la empresa o
        el postulante no tiene CV activo ("El postulante aún no ha cargado un CV.").
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: URL de descarga del CV.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: URL de descarga del CV.
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: url
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/empresa/postulaciones/{id}/cv/archivo/{archivo}:
    get:
      tags: [Empresa]
      operationId: empresaPostulacionCvArchivo
      summary: Descargar CV del postulante (driver local)
      description: |
        Sirve el CV en binario (solo driver `local`; con Supabase responde 404 y la
        descarga usa la URL firmada de `/cv`). Valida que la postulación sea de la empresa
        y que la clave base64url corresponda al `object_key` del CV del postulante.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: archivo
          in: path
          required: true
          description: Clave del objeto en base64url (sin padding).
          schema:
            type: string
      responses:
        '200':
          description: "Archivo binario (PDF/DOC/DOCX). Header `Content-Disposition: attachment`."
          headers:
            Content-Disposition:
              description: attachment; filename="<nombre original>"
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # BOLSA PÚBLICA — ofertas publicadas (sin sesión)
  # ---------------------------------------------------------------
  /api/ofertas:
    get:
      tags: [Bolsa pública]
      operationId: ofertasPublicasListar
      summary: Buscar ofertas publicadas (público)
      description: |
        Lista las ofertas en estado `publicada` y vigentes, sin autenticación. Acepta los
        filtros `categoria_id`, `ubicacion`, `formacion` y `experiencia`. Para postularse
        se requiere sesión de postulante.
      parameters:
        - name: categoria_id
          in: query
          schema:
            type: integer
        - name: ubicacion
          in: query
          schema:
            type: string
        - name: formacion
          in: query
          schema:
            type: string
        - name: experiencia
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de ofertas publicadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/ofertas/{id}:
    get:
      tags: [Bolsa pública]
      operationId: ofertasPublicasDetalle
      summary: Detalle de oferta publicada (público)
      description: |
        Detalle público de la oferta. Si la petición incluye un token válido de un
        postulante activo, la respuesta agrega `ya_postule`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detalle de la oferta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # AUTENTICACIÓN — ingreso con Google (postulantes)
  # ---------------------------------------------------------------
  /api/auth/google:
    post:
      tags: [Autenticación]
      operationId: authGoogle
      summary: Ingreso o registro de postulante con Google
      description: |
        Verifica el `id_token` de Google contra sus certificados públicos (requiere
        `google.clientId` en el backend). Si el correo no tiene cuenta, crea una de
        postulante con `proveedor=google` (sin DNI); en ambos casos inicia sesión.

        **Rate limit (token bucket)**: 10 tokens por IP con recarga de 1 token cada 30 s
        (`throttle:10,300`). Tras la ráfaga de 10 responde `429` con `Retry-After` y luego
        habilita 1 solicitud cada 30 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: Credencial JWT de Google Sign-In.
      responses:
        '200':
          description: Sesión iniciada (mismo contrato que el login).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # REGISTRO Y ACTIVACIÓN DE EMPRESAS (público)
  # ---------------------------------------------------------------
  /api/verificar-ruc:
    post:
      tags: [Registro y activación de empresas]
      operationId: verificarRuc
      summary: Verificar RUC en SUNAT
      description: |
        Consulta el RUC en SUNAT (token `sunat.token`) y autocompleta `razon_social`,
        `nombre_comercial` y `direccion` para el formulario de solicitud.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruc]
              properties:
                ruc:
                  type: string
                  description: RUC de 11 dígitos.
      responses:
        '200':
          description: RUC verificado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      razon_social:
                        type: string
                      nombre_comercial:
                        type: string
                        nullable: true
                      direccion:
                        type: string
                        nullable: true
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/solicitudes-empresa:
    post:
      tags: [Registro y activación de empresas]
      operationId: solicitudEmpresaCrear
      summary: Enviar solicitud de registro de empresa
      description: |
        Crea la solicitud en estado `pendiente` previa verificación del RUC (SUNAT).
        409 si el RUC ya tiene empresa registrada o una solicitud pendiente/aprobada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruc, email, telefono, representante]
              properties:
                ruc:
                  type: string
                email:
                  type: string
                  format: email
                  description: Correo corporativo; será el usuario de login al activar.
                telefono:
                  type: string
                  pattern: '^(?:\d{9}|\d{11})$'
                  description: Teléfono de contacto (9 u 11 dígitos). Requerido.
                representante:
                  type: string
      responses:
        '201':
          description: Solicitud enviada (queda pendiente de aprobación municipal).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      estado:
                        type: string
                        example: pendiente
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/activar-cuenta/{token}:
    get:
      tags: [Registro y activación de empresas]
      operationId: activacionVer
      summary: Validar enlace de activación
      description: |
        Valida el token de un solo uso (vigencia `activacion.expiraDias`). Devuelve
        `razon_social` y `email` para mostrar el formulario de contraseña.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: El enlace es válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Registro y activación de empresas]
      operationId: activacionActivar
      summary: Activar la cuenta de la empresa
      description: |
        Define la contraseña, activa el usuario y la empresa y deja el enlace inservible
        (un solo uso). Con `email.host` configurado se notifica por correo al aprobar.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password2]
              properties:
                password:
                  type: string
                  minLength: 8
                password2:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — bandeja de solicitudes de empresas
  # ---------------------------------------------------------------
  /api/admin/solicitudes-empresa:
    get:
      tags: [Admin]
      operationId: adminSolicitudesListar
      summary: Listar solicitudes de registro de empresa
      description: |
        Bandeja municipal. Filtros `estado` (`pendiente`, `aprobada`, `rechazada`) y `q`.
        Respuesta paginada: `data.data` (filas) y `data.total`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, aprobada, rechazada]
        - $ref: '#/components/parameters/Limite'
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista de solicitudes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/admin/solicitudes-empresa/{id}:
    get:
      tags: [Admin]
      operationId: adminSolicitudDetalle
      summary: Detalle de una solicitud
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detalle de la solicitud.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/admin/solicitudes-empresa/{id}/aprobar:
    post:
      tags: [Admin]
      operationId: adminSolicitudAprobar
      summary: Aprobar solicitud y crear la cuenta de la empresa
      description: |
        Crea el usuario (estado `inactivo`, login con el correo corporativo) y la empresa
        con `evaluacion_presencial=1`, genera el enlace de activación y notifica por correo
        (best-effort). Devuelve el enlace como respaldo interno.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Solicitud aprobada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      link:
                        type: string
                        description: Enlace de activación (para reenvío interno).
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/admin/solicitudes-empresa/{id}/rechazar:
    post:
      tags: [Admin]
      operationId: adminSolicitudRechazar
      summary: Rechazar solicitud con motivo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  description: Motivo del rechazo (se notifica a la empresa).
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/admin/solicitudes-empresa/{id}/enlace:
    get:
      tags: [Admin]
      operationId: adminSolicitudEnlace
      summary: Obtener o regenerar el enlace de activación
      description: |
        Solo para solicitudes aprobadas. Regenera el token (invalida el anterior) y
        devuelve el enlace completo hacia el frontend (`app.frontendUrl`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Enlace generado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      link:
                        type: string
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN / EMPRESA — flujo de ofertas actualizado
  # ---------------------------------------------------------------
  /api/admin/ofertas/{id}/cerrar:
    put:
      tags: [Admin]
      operationId: adminOfertaCerrar
      summary: Cerrar una oferta publicada (supervisión)
      description: |
        El admin solo supervisa: cierra una oferta en estado `publicada`. La publicación
        directa la hace la empresa (`PUT /api/empresa/ofertas/{id}/publicar`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/empresa/ofertas/{id}/publicar:
    put:
      tags: [Empresa]
      operationId: empresaOfertaPublicar
      summary: Publicar oferta directamente (sin validación municipal)
      description: |
        Transición `borrador → publicada` (RF-24 ajustado: publicación directa por la
        empresa; el admin solo supervisa). Solo ofertas propias en `borrador`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador numérico (ruta `(:num)`).
      schema:
        type: integer
        minimum: 1
      name: seccion
      in: path
      required: true
      description: Sección del perfil. Valores admitidos (otro valor responde 400).
      schema:
        type: string
        enum: [formacion, experiencia, habilidades, cursos]
    Q:
      name: q
      in: query
      description: Búsqueda por texto (LIKE).
      schema:
        type: string
    Limite:
      name: limite
      in: query
      description: Cantidad de filas (por defecto 100; se castea a entero, sin tope máximo).
      schema:
        type: integer
        default: 100
    Offset:
      name: offset
      in: query
      description: Desplazamiento para paginar (por defecto 0).
      schema:
        type: integer
        default: 0
    Desde:
      name: desde
      in: query
      description: Fecha inicial del rango (`AAAA-MM-DD`). En dashboard/reportes se valida el formato.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    Hasta:
      name: hasta
      in: query
      description: Fecha final del rango (`AAAA-MM-DD`).
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    UsuarioRol:
      name: rol
      in: query
      description: Filtro por rol (sin validación del valor).
      schema:
        type: string
        enum: [admin, empresa, postulante]
    EstadoCuenta:
      name: estado
      in: query
      description: Filtro por estado de la cuenta (sin validación del valor).
      schema:
        type: string
        enum: [activo, inactivo]
    EstadoEmpresa:
      name: estado
      in: query
      description: Filtro por estado de la empresa (sin validación del valor).
      schema:
        type: string
        enum: [activo, inactivo]
    EstadoOferta:
      name: estado
      in: query
      description: Filtro por estado de la oferta. Se valida (valor inválido responde 422).
      schema:
        type: string
        enum: [borrador, publicada, cerrada]
    EstadoActividad:
      name: estado
      in: query
      description: Filtro por estado de la actividad (sin validación del valor).
      schema:
        type: string
        enum: [programado, en_curso, finalizado, cancelado]
    TipoActividad:
      name: tipo
      in: query
      description: Filtro por tipo de actividad (sin validación del valor).
      schema:
        type: string
        enum: [feria_empleo, evento, taller, capacitacion]
      name: tipo
      in: query
      description: Filtro por tipo de atención (sin validación del valor).
      schema:
        type: string
        enum: [orientacion_laboral, asesoria_cv, preparacion_entrevista, orientacion_vocacional, formacion_empleo, emprendimiento, autoempleo, derivacion_trabajo_social]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT firmado HS256 (expiración por defecto 120 min). Debe enviarse el
        header `Authorization: Bearer <token>`. El rol y el estado se recargan de MySQL en
        cada petición. El refresh token se obtiene en `POST /api/auth/login` o
        `POST /api/auth/refresh` (no es un JWT; es una cadena de 64 caracteres hex).

  schemas:
    # ----------------------- Envoltorios -----------------------
    EnvelopeError:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Hay errores en los datos enviados.
        errors:
          type: array
          items:
            type: string
          example: ['El campo Dni es obligatorio.']

    RespuestaDataNull:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación exitosa.
        data:
          type: object
          nullable: true
          example: null
          description: Siempre null en estas respuestas (HTTP 200, el backend no usa 204).

    RespuestaSistema:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: API del Sistema de Empleo — Municipalidad Distrital de José Leonardo Ortiz.
        data:
          type: object
          nullable: true

    # ----------------------- Autenticación -----------------------
    LoginBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Nombre de usuario. Para empresas y postulantes es el RUC o DNI.
        password:
          type: string
          format: password

    RefreshBody:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token vigente (64 caracteres hex) emitido en login/refresh.

    RegistroPostulanteBody:
      type: object
      required: [dni, nombres, apellidos, password, password2]
      properties:
        dni:
          type: string
          pattern: '^\d{8}$'
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          pattern: '^(?:\d{9}|\d{11})$'
          description: Teléfono (9 u 11 dígitos).
        password:
          type: string
          format: password
          minLength: 8
        password2:
          type: string
          format: password
          description: Debe coincidir con `password`.

    CambiarContrasenaBody:
      type: object
      required: [password_actual, password, password2]
      properties:
        password_actual:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 8
        password2:
          type: string
          format: password

    UsuarioPublico:
      type: object
      required: [id, username, rol, nombres, apellidos, email]
      properties:
        id:
          type: integer
        username:
          type: string
        rol:
          type: string
          enum: [admin, empresa, postulante]
        nombres:
          type: string
        apellidos:
          type: string
        email:
          type: string
          nullable: true

    Sesion:
      type: object
      required: [access_token, refresh_token, token_type, expira_en, usuario]
      properties:
        access_token:
          type: string
          description: JWT HS256 de acceso.
        refresh_token:
          type: string
          description: Refresh token (64 hex). Rota en cada renovación.
        token_type:
          type: string
          example: Bearer
        expira_en:
          type: integer
          description: Segundos de validez del access token (por defecto 7200).
          example: 7200
        usuario:
          $ref: '#/components/schemas/UsuarioPublico'

    # ----------------------- Usuarios (admin) -----------------------
    UsuarioDetalle:
      type: object
      required: [id, username, rol, nombres, apellidos, estado, ultimo_acceso]
      properties:
        id:
          type: integer
        username:
          type: string
        rol:
          type: string
          enum: [admin, empresa, postulante]
        nombres:
          type: string
        apellidos:
          type: string
        email:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        estado:
          type: string
          enum: [activo, inactivo]
        ultimo_acceso:
          type: string
          nullable: true
          description: 'Formato: YYYY-MM-DD HH:MM:SS o null.'

    UsuarioAdminFila:
      type: object
      description: |
        Fila del listado `GET /api/admin/usuarios`. Columnas explícitas de `users` (sin
        `password_hash`) más las columnas de los LEFT JOIN. El hash de contraseña nunca
        forma parte de la respuesta.
      properties:
        id:
          type: integer
        username:
          type: string
        rol:
          type: string
          enum: [admin, empresa, postulante]
        nombres:
          type: string
        apellidos:
          type: string
        email:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        estado:
          type: string
          enum: [activo, inactivo]
        ultimo_acceso:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        empresa_id:
          type: integer
          nullable: true
          description: Id de la empresa asociada (si el rol es empresa).
        razon_social:
          type: string
          nullable: true
        empresa_estado:
          type: string
          nullable: true
          enum: [activo, inactivo]
        postulante_id:
          type: integer
          nullable: true
          description: Id del postulante asociado (si el rol es postulante).

    UsuarioCrearBody:
      type: object
      required: [username, nombres, apellidos, password]
      properties:
        username:
          type: string
          maxLength: 60
          pattern: '^[a-zA-Z0-9._-]+$'
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          pattern: '^(?:\d{9}|\d{11})$'
          description: Teléfono (9 u 11 dígitos).
        password:
          type: string
          format: password
          minLength: 8
          description: El rol siempre es `admin` (no se recibe del cuerpo).

    UsuarioActualizarBody:
      type: object
      required: [nombres, apellidos]
      properties:
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          pattern: '^(?:\d{9}|\d{11})$'
          description: Teléfono (9 u 11 dígitos).

    EstadoBody:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [activo, inactivo]

    NuevaPasswordBody:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8

    # ----------------------- Empresas -----------------------
    Empresa:
      type: object
      description: Columnas de la tabla `empresas`.
      properties:
        id:
          type: integer
        user_id:
          type: integer
        ruc:
          type: string
          description: 11 dígitos.
        razon_social:
          type: string
        nombre_comercial:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        representante:
          type: string
          nullable: true
        info_adicional:
          type: string
          nullable: true
        evaluacion_presencial:
          type: integer
          enum: [0, 1]
        estado:
          type: string
          enum: [activo, inactivo]
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true

    EmpresaFila:
      type: object
      description: Fila del listado admin (empresas + datos del usuario).
      allOf:
        - $ref: '#/components/schemas/Empresa'
        - type: object
          properties:
            username:
              type: string
            user_estado:
              type: string
              enum: [activo, inactivo]
            user_email:
              type: string
              nullable: true

    EmpresaDetalle:
      type: object
      description: Detalle admin de empresa (fila + cantidad de ofertas).
      allOf:
        - $ref: '#/components/schemas/EmpresaFila'
        - type: object
          properties:
            cantidad_ofertas:
              type: integer
              description: Total de ofertas de la empresa (sin filtrar por estado).

    EmpresaCrearBody:
      type: object
      required: [ruc, razon_social, password]
      properties:
        ruc:
          type: string
          pattern: '^\d{11}$'
        razon_social:
          type: string
          maxLength: 200
        nombre_comercial:
          type: string
          maxLength: 150
        direccion:
          type: string
          maxLength: 255
        telefono:
          type: string
          maxLength: 30
          pattern: '^(?:\d{9}|\d{11})$'
          description: Teléfono (9 u 11 dígitos).
        email:
          type: string
          format: email
          maxLength: 150
        representante:
          type: string
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña inicial creada por el administrador.
        evaluacion_presencial:
          type: boolean
          description: 'Truthy: cuenta/empresa nacen activas. Sin validación de regla.'
        info_adicional:
          type: string
          description: Sin regla de validación.

    EmpresaActualizarBody:
      type: object
      required: [razon_social]
      properties:
        razon_social:
          type: string
          maxLength: 200
        nombre_comercial:
          type: string
          maxLength: 150
        direccion:
          type: string
          maxLength: 255
        telefono:
          type: string
          maxLength: 30
          pattern: '^(?:\d{9}|\d{11})$'
          description: Teléfono (9 u 11 dígitos).
        email:
          type: string
          format: email
          maxLength: 150
        representante:
          type: string
          maxLength: 150
        info_adicional:
          type: string
          description: Sin regla de validación; solo editable por admin.

    EmpresaPerfilBody:
      type: object
      properties:
        nombre_comercial:
          type: string
          maxLength: 150
        direccion:
          type: string
          maxLength: 255
        telefono:
          type: string
          maxLength: 30
          pattern: '^(?:\d{9}|\d{11})$'
          description: Teléfono (9 u 11 dígitos).
        email:
          type: string
          format: email
          maxLength: 150
        representante:
          type: string
          maxLength: 150

    # ----------------------- Ofertas -----------------------
    Oferta:
      type: object
      description: Columnas de la tabla `ofertas` (más `empresa_id`/`categoria_id` referenciales).
      properties:
        id:
          type: integer
        empresa_id:
          type: integer
        categoria_id:
          type: integer
          nullable: true
        puesto:
          type: string
        descripcion:
          type: string
          nullable: true
        funciones:
          type: string
          nullable: true
        requisitos:
          type: string
          nullable: true
        formacion_requerida:
          type: string
          nullable: true
        experiencia_requerida:
          type: string
          nullable: true
        tipo_empleo:
          type: string
          nullable: true
          enum: [tiempo_completo, medio_tiempo, por_horas, practicas, freelance, remoto]
        ubicacion:
          type: string
          nullable: true
        remuneracion:
          type: string
          nullable: true
          description: 'DECIMAL(10,2). MySQL lo entrega como cadena (p. ej. "1130.00").'
        vacantes:
          type: integer
        fecha_publicacion:
          type: string
          nullable: true
          format: date
        fecha_cierre:
          type: string
          nullable: true
          format: date
        estado:
          type: string
          enum: [borrador, publicada, cerrada]
        motivo_rechazo:
          type: string
          nullable: true
        validado_por:
          type: integer
          nullable: true
        fecha_validacion:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true

    OfertaFila:
      type: object
      description: Oferta con empresa y categoría (JOIN). No incluye habilidades ni cantidad de postulaciones.
      allOf:
        - $ref: '#/components/schemas/Oferta'
        - type: object
          properties:
            categoria_nombre:
              type: string
              nullable: true
            ruc:
              type: string
              nullable: true
            razon_social:
              type: string
              nullable: true

    OfertaDetalle:
      type: object
      description: Detalle de oferta (listados de admin/empresa/ver oferta postulante).
      allOf:
        - $ref: '#/components/schemas/OfertaFila'
        - type: object
          properties:
            habilidades:
              type: array
              description: Habilidades ordenadas alfabéticamente.
              items:
                type: string
            cantidad_postulaciones:
              type: integer
              description: Postulaciones activas a la oferta.
            ya_postule:
              type: boolean
              description: 'Solo presente en el detalle público del postulante con perfil: si ya tiene postulación activa.'

    OfertaBody:
      type: object
      required: [puesto, vacantes]
      properties:
        puesto:
          type: string
          maxLength: 150
        descripcion:
          type: string
          maxLength: 10000
        funciones:
          type: string
          maxLength: 10000
        requisitos:
          type: string
          maxLength: 10000
        formacion_requerida:
          type: string
          maxLength: 200
        experiencia_requerida:
          type: string
          maxLength: 200
        tipo_empleo:
          type: string
          enum: [tiempo_completo, medio_tiempo, por_horas, practicas, freelance, remoto]
        ubicacion:
          type: string
          maxLength: 150
        remuneracion:
          type: string
          pattern: '^\d{1,10}(\.\d{1,2})?$'
          description: Envío como cadena o número; se valida contra el patrón.
        vacantes:
          type: integer
          minimum: 1
          description: Exigido manualmente (≥ 1); vacío o menor a 1 responde 422.
        fecha_cierre:
          type: string
          format: date
          description: No puede ser anterior a hoy (se compara en UTC).
        categoria_id:
          type: integer
          description: Debe existir en `categorias` si se envía.
        habilidades:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
              description: Cadena CSV separada por comas (alternativa soportada).
          description: Habilidades de la oferta.

      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 255
          description: Motivo del rechazo (se exigen al menos 5 caracteres; se trunca a 255).

    # ----------------------- Categorías -----------------------
    Categoria:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        activo:
          type: integer
          enum: [0, 1]

