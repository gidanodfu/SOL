        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Contrataciones registradas.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Contrataciones registradas.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContratacionFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # EMPRESA — perfil y dashboard
  # ---------------------------------------------------------------
  /api/empresa/perfil:
    get:
      tags: [Empresa]
      operationId: empresaPerfil
      summary: Datos de la empresa propia
      description: |
        Devuelve la fila `empresas.*` asociada a la cuenta de la sesión (sin join al
        usuario). 404 si la cuenta no tiene empresa: "No se encontró la empresa asociada a
        su cuenta."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos de su empresa.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Datos de su empresa.
                  data:
                    $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Empresa]
      operationId: empresaActualizarPerfil
      summary: Actualizar datos de contacto de la empresa
      description: |
        La empresa solo puede editar su propio `nombre_comercial`, `direccion`, `telefono`,
        `email` y `representante`. No puede editar RUC, razón social, `info_adicional`,
        `evaluacion_presencial` ni estado.
      security:
