openapi: 3.0.3

info:
  title: API Sistema de Empleo — Municipalidad Distrital de José Leonardo Ortiz (SOL)
  version: 1.1.0
  description: |
    Especificación generada a partir de la revisión del código real del backend
    (CodeIgniter 4.7, PHP 8.2+, MySQL) y de sus rutas en `app/Config/Routes.php`.

    Cambios 2026-09-10 (versión 1.1.0): rate limiting en autenticación y subida de CV,
    límite de 4 CV por mes calendario, validación de teléfono (9 u 11 dígitos),
    eliminación de `password_hash` de las respuestas y saneamiento de errores 500.

    Convenciones transversales (verificadas en `app/Controllers/Api/BaseApiController.php`,
    `app/Exceptions/ApiExceptionHandler.php`, `app/Filters/JwtAuthFilter.php` y
    `app/Filters/RoleFilter.php`):

    * **Envoltorio de éxito**: `{"success": true, "message": "<texto>", "data": <objeto|array|null>}`.
      No incluye la clave `errors`. Códigos HTTP: `200` y `201`.
    * **Envoltorio de error**: `{"success": false, "message": "<texto>", "errors": [<string>, ...]}`.
      No incluye `data`. `errors` siempre es un arreglo de cadenas (puede ser `[]`).
      Códigos usados: `400`, `401`, `403`, `404`, `409`, `422`, `429`, `500`.
    * **Autenticación**: header `Authorization: Bearer <access_token>` (JWT HS256).
      El rol y el estado `activo` del usuario se recargan desde MySQL en cada
      petición; no se confía en el `rol` del token.
    * **Roles**: los grupos de rutas aplican `rol:admin`, `rol:empresa` o
      `rol:postulante`. Un rol distinto recibe `403`.
    * **Importante (comportamiento real, no un error de esta documentación)**:
      el helper `sinContenido()` del backend responde **HTTP 200** (no 204) con
      `data: null`. No existe ningún `204` en esta API.
    * **Acciones de estado**: la API no usa PATCH ni DELETE para estados; las
      transiciones se realizan con `PUT` sobre sub-rutas (`/estado`, `/password`,
      `/publicar`, `/cerrar`, `/activacion`, `/retirar`).
    * **Booleano**: algunos endpoints castean con `(bool) $cuerpo['activo']`, donde en
      PHP `(bool)"false" === true`. Envíe siempre booleanos nativos (`true`/`false`),
      no las cadenas `"true"`/`"false"`.
    * **Preflight CORS**: `OPTIONS /api/*` responde `204` sin cuerpo y no requiere
      autenticación (no se documenta como operación).
    * **Identidad**: en los módulos empresa y postulante la identidad se resuelve
      siempre de la sesión; acceder a un recurso de otro rol/empresa/postulante
      devuelve `404` (no `403`) para no revelar existencia (anti-enumeración).
    * **Fechas**: los campos `date`/`datetime` se devuelven como cadenas
      (`YYYY-MM-DD` y `YYYY-MM-DD HH:MM:SS`). El backend opera en UTC
      (`Config/App.php appTimezone = 'UTC'`); las validaciones de "hoy" y los
      rangos usan `date('Y-m-d')` en esa zona.
    * **Rate limiting**: los endpoints sensibles usan el Throttler nativo de CI4
      (`app/Filters/ThrottleFilter.php` y `AuthService`), que implementa un **token bucket**:
      permite una ráfaga inicial (la capacidad) y luego repone 1 token a intervalos de
      `segundos / capacidad`. No es una ventana fija de bloqueo: al agotar la ráfaga
      responde `429` con `Retry-After` (≈ `segundos / capacidad`) y habilita un intento por
      intervalo. Los valores concretos se detallan en cada operación.
    * **Teléfono**: los campos `telefono` de los cuerpos validados aceptan 9 u 11 dígitos
      (`^(?:\d{9}|\d{11})$`); el backend es la validación definitiva.
    * **Errores internos**: los `500` devuelven siempre un mensaje genérico
      ("Ocurrió un error inesperado. Intente nuevamente."); el detalle (SQL, rutas,
      excepciones) solo queda en el log del backend, nunca en la respuesta HTTP.

    Notas sobre el entorno:
    * `servers.url` corresponde a la `baseURL` del entorno de desarrollo
      (`http://localhost:8080`). Debe ajustarse al dominio de producción.
    * CORS por defecto solo permite `http://localhost:5173` (frontend de
      desarrollo); en producción se configura con la variable de entorno
      `cors.allowedOrigins`.

    Esta especificación documenta el comportamiento actual del backend. Cuando la
    documentación/código observado presenta un comportamiento que conviene
    verificar o corregir, se indica en la descripción de la operación o del esquema.

servers:
  - url: http://localhost:8080
    description: |
      Entorno de desarrollo (valor de `app.baseURL`). Configurable según despliegue:
      en producción apuntar a la URL pública del backend y revisar CORS.

tags:
  - name: Sistema
    description: Información básica del servicio.
  - name: Autenticación
    description: Login, renovación y cierre de sesión, registro público de postulantes e ingreso con Google (público).
  - name: Cuenta
    description: Operaciones de la cuenta propia de cualquier rol autenticado.
  - name: Admin
    description: "Gestión municipal (rol `admin`): usuarios, empresas y solicitudes de registro, ofertas, actividades, oportunidades, contrataciones, dashboard y reportes."
  - name: Empresa
    description: "Portal de la empresa (rol `empresa`): perfil, ofertas, postulaciones, contrataciones y CV."
  - name: Postulante
    description: "Portal del postulante (rol `postulante`): perfil (datos personales y CV), bolsa pública, postulaciones y oportunidades."
  - name: Catálogos y divulgación
    description: Categorías, actividades y oportunidades públicas y para roles autenticados.
  - name: Bolsa pública
    description: "Ofertas publicadas y vigentes consultables sin sesión (`GET /api/ofertas`); el detalle informa `ya_postule` si la petición trae un token válido de postulante."
  - name: Registro y activación de empresas
    description: "Solicitud pública de registro de empresa (RUC verificado), verificación previa del RUC y activación de la cuenta con enlace de un solo uso tras la aprobación municipal."

security:
  - {}

paths:
  /:
    get:
      tags: [Sistema]
      operationId: raiz
      summary: Información de la API
      description: Endpoint raíz (fuera de `/api`). Devuelve el mensaje institucional. Sin autenticación.
      responses:
        '200':
          description: Información del sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSistema'

  /health:
    get:
      tags: [Sistema]
      operationId: healthCheck
      summary: Disponibilidad de la API (health check)
      description: |
        Endpoint público de disponibilidad (fuera de `/api`). No requiere autenticación,
        no consulta la base de datos ni servicios externos y no expone datos internos.
        La API de negocio permanece bajo `/api` (sin versionar).
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Servicio disponible.
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: ok

  /api/auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión
      description: |
        Autentica con `username` (para empresa/postulante es el RUC/DNI) y `password`.
        Devuelve access token (JWT, 120 min), refresh token (64 caracteres hex, 15 días) y el
        usuario público. Público (sin autenticación).

        **Rate limit (token bucket)**: 5 tokens por IP+usuario con recarga de 1 token cada
        60 s (capacidad 5 en 300 s). Se permiten 5 intentos seguidos; agotada la ráfaga, el
        6.º y siguientes responden `429` con `Retry-After` ≈ 60 s y luego se habilita
        1 intento por minuto. El bucket vuelve a 5 solo tras 5 min sin intentos. Solo
        cuentan los fallos (un login correcto borra el contador). No hay bloqueo permanente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Sesión iniciada. `data` contiene las credenciales de acceso.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Bienvenido.
                  data:
                    $ref: '#/components/schemas/Sesion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/auth/refresh:
    post:
      tags: [Autenticación]
      operationId: renovarSesion
      summary: Renovar sesión (rotación de refresh token)
      description: |
        Presenta el `refresh_token` vigente. El token presentado se revoca y se emite un
        par nuevo (rotación). Un refresh token usado o revocado no puede reutilizarse.
        Público (sin autenticación). No se exige header Authorization.

        **Rate limit (token bucket)**: 10 tokens por IP con recarga de 1 token cada 30 s
        (`throttle:10,300`). Tras la ráfaga de 10 responde `429` con `Retry-After` y luego
        habilita 1 solicitud cada 30 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshBody'
      responses:
        '200':
          description: Sesión renovada. `data` trae un par de tokens nuevo.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sesión renovada.
                  data:
                    $ref: '#/components/schemas/Sesion'
        '401':
          description: "Refresh token ausente, expirado o revocado. Mensajes reales: \"No se recibió el token de renovación.\", \"La sesión expiró. Inicie sesión nuevamente.\", \"Su cuenta no se encuentra activa.\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/registro/postulante:
    post:
      tags: [Autenticación]
      operationId: registrarPostulante
      summary: Registro público de postulante
      description: |
        Crea una cuenta con rol `postulante`. El `username` es el DNI. Solo crea cuentas
        de postulante (nunca empresa/admin). Los mensajes de conflicto permiten conocer
        si un DNI o correo ya está registrado. Público.

        La cuenta se crea con **auto-login**: `data` es la misma sesión que devuelve el
        login (`access_token`, `refresh_token`, `usuario`, …), por lo que el frontend
        redirige directo a la bolsa de empleo.

        **Rate limit (token bucket)**: 10 tokens por IP con recarga de 1 token cada 30 s
        (`throttle:10,300`). Tras la ráfaga de 10 responde `429` con `Retry-After` y luego
        habilita 1 solicitud cada 30 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroPostulanteBody'
      responses:
        '201':
          description: Cuenta creada con sesión iniciada (auto-login). `data` es la sesión.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cuenta creada correctamente. Bienvenido.
                  data:
                    $ref: '#/components/schemas/Sesion'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/auth/me:
    get:
      tags: [Autenticación]
      operationId: usuarioActual
      summary: Datos de la cuenta autenticada
      description: |
        Devuelve el usuario público de la sesión. Acepta cualquier rol autenticado y
        activo. El `rol` refleja el estado vigente en MySQL (se recarga en cada petición).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos de la cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Datos de la cuenta.
                  data:
                    $ref: '#/components/schemas/UsuarioPublico'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: |
        Revoca todos los refresh tokens del usuario. Los access tokens emitidos siguen
        siendo válidos hasta su expiración (no existe blacklist). Cualquier rol autenticado.
        Responde HTTP 200 (no 204) con `data: null`.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/cuenta/contrasena:
    put:
      tags: [Cuenta]
      operationId: cambiarContrasena
      summary: Cambiar contraseña propia
      description: |
        Cambia la contraseña del usuario autenticado. Verifica la contraseña actual
        contra el hash almacenado (si no coincide responde 400). Cualquier rol.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '400':
          description: La contraseña actual es incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/categorias:
    get:
      tags: [Catálogos y divulgación]
      operationId: listarCategorias
      summary: Categorías laborales activas
      description: |
        Lista las categorías con `activo = 1`, ordenadas por nombre. Disponible para
        cualquier rol autenticado. `data` es un arreglo plano.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorías laborales.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Categorías laborales.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categoria'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # Rutas de divulgación compartidas (cualquier rol autenticado)
  # ---------------------------------------------------------------
  /api/actividades:
    get:
      tags: [Catálogos y divulgación]
      operationId: divulgacionActividades
      summary: Ferias y actividades programadas (públicas)
      description: |
        Lista actividades con estado `programado` o `en_curso`, ordenadas por
        `fecha_inicio DESC`, con tope fijo de 200 filas (sin paginación). No filtra por
        fecha: una actividad "programado" con fecha pasada sigue apareciendo aquí.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ferias y actividades programadas.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Ferias y actividades programadas.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actividad'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/oportunidades:
    get:
      tags: [Catálogos y divulgación]
      operationId: divulgacionOportunidades
      summary: Oportunidades de empleo públicas
      description: |
        Oportunidades con `activo = 1` y `fecha_publicacion <= hoy`, ordenadas por
        `created_at DESC`, tope fijo 200 (sin paginación). Cada fila incluye la
        `razon_social` de la empresa (LEFT JOIN, puede ser `null`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Oportunidades de empleo.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Oportunidades de empleo.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Oportunidad'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — usuarios
  # ---------------------------------------------------------------
  /api/admin/usuarios:
    get:
      tags: [Admin]
      operationId: adminListarUsuarios
      summary: Listar usuarios (admin)
      description: |
        Listado paginado con `limite`/`offset`. Filtros opcionales `rol`, `estado` y `q`
        (búsqueda en username/nombres/apellidos/RUC/razón social/DNI). Sin validación de
        los valores de filtro. Orden: `created_at DESC`.

        La consulta selecciona columnas explícitas de `users` y **nunca** incluye
        `password_hash` (ver esquema `UsuarioAdminFila`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioRol'
        - $ref: '#/components/parameters/EstadoCuenta'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Lista de usuarios. `data` = `{ data: [...], total }`."
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lista de usuarios.
                  data:
                    type: object
                    required: [data, total]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UsuarioAdminFila'
                      total:
                        type: integer
                        example: 12
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Admin]
      operationId: adminCrearUsuario
      summary: Crear usuario (admin)
      description: |
        Crea personal municipal: **siempre** con rol `admin` (no existe campo `rol` en el
        cuerpo). Los roles empresa/postulante se crean por sus propios flujos. El username
        debe ser único.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrearBody'
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Usuario creado correctamente.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          description: El nombre de usuario ya está en uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Admin]
      operationId: adminVerUsuario
      summary: Detalle de usuario (admin)
      description: |
        Detalle del usuario sin `password_hash`. Mensaje real 404: "El usuario no existe."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle del usuario.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detalle del usuario.
                  data:
                    $ref: '#/components/schemas/UsuarioDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Admin]
      operationId: adminActualizarUsuario
      summary: Actualizar datos de usuario (admin)
      description: |
        Actualiza nombres, apellidos, email y teléfono. No modifica `username`, `rol` ni
        contraseña. HTTP 200 con `data: null`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizarBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/usuarios/{id}/estado:
    put:
      tags: [Admin]
      operationId: adminCambiarEstadoUsuario
      summary: Activar/desactivar usuario (admin)
      description: |
        Cambia `users.estado` a `activo` o `inactivo`. Si el usuario es rol `empresa`,
        sincroniza también `empresas.estado`. Si el valor ya es el actual no hace nada
        (no-op) y responde igual.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/usuarios/{id}/password:
    put:
      tags: [Admin]
      operationId: adminResetearPasswordUsuario
      summary: Restablecer contraseña de usuario (admin)
      description: |
        Reemplaza el hash de la contraseña del usuario. En la ruta se usa el segmento
        `password` (inglés), a diferencia de `PUT /api/cuenta/contrasena` (español).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaPasswordBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — empresas
  # ---------------------------------------------------------------
  /api/admin/empresas:
    get:
      tags: [Admin]
      operationId: adminListarEmpresas
      summary: Listar empresas (admin)
      description: |
        Listado paginado con `limite`/`offset`. Filtros `estado` y `q` (RUC, razón social
        o nombre comercial). Orden `created_at DESC`.

        **Hallazgo documentado**: el `total` se calcula ignorando el filtro `q`, por lo
        que al buscar con `q` el `total` puede superar a la cantidad de filas devueltas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EstadoEmpresa'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Lista de empresas. `data` = `{ data: [...], total }`."
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lista de empresas.
                  data:
                    type: object
                    required: [data, total]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmpresaFila'
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Admin]
      operationId: adminRegistrarEmpresa
      summary: Registrar empresa (admin)
      description: |
        Registro exclusivo municipal. Crea el usuario (rol `empresa`, `username` = RUC) y el
        perfil de empresa en una transacción. Si `evaluacion_presencial` es truthy la cuenta
        y la empresa nacen `activo`; si no, `inactivo`. Campos no validados pero usados:
        `evaluacion_presencial` e `info_adicional`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaCrearBody'
      responses:
        '201':
          description: Empresa registrada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Empresa registrada. Las credenciales de acceso corresponden a la Municipalidad entregarlas.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          description: RUC ya registrado o RUC en uso como username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/empresas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Admin]
      operationId: adminVerEmpresa
      summary: Detalle de empresa (admin)
      description: |
        Fila de empresa con datos del usuario asociado y `cantidad_ofertas` (todas las
        ofertas, sin filtro de estado). Mensaje real 404: "La empresa no existe."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle de la empresa.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detalle de la empresa.
                  data:
                    $ref: '#/components/schemas/EmpresaDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Admin]
      operationId: adminActualizarEmpresa
      summary: Actualizar datos de empresa (admin)
      description: |
        Actualiza razón social, datos de contacto e `info_adicional`. No modifica RUC,
        estado ni la cuenta `users` asociada (los datos de la cuenta de acceso quedan
        desactualizados tras cambiar email/razón social — ver informe de auditoría).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaActualizarBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/empresas/{id}/estado:
    put:
      tags: [Admin]
      operationId: adminCambiarEstadoEmpresa
      summary: Activar/desactivar empresa (admin)
      description: |
        Cambia `empresas.estado` y sincroniza `users.estado` de su usuario. No-op si ya
        coincide. Estado inactivo bloquea el acceso de la empresa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/empresas/{id}/password:
    put:
      tags: [Admin]
      operationId: adminResetearPasswordEmpresa
      summary: Restablecer contraseña de empresa (admin)
      description: |
        Reemplaza el hash de la contraseña del usuario asociado a la empresa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaPasswordBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — dashboard
  # ---------------------------------------------------------------
  /api/admin/dashboard:
    get:
      tags: [Admin]
      operationId: adminDashboard
      summary: Dashboard municipal
      description: |
        Indicadores de gestión del empleo con rango de fechas opcional (`AAAA-MM-DD`).
        Nota (comportamiento real): el contador `ofertas` es global (no se filtra por
        rango), mientras que postulaciones/contrataciones/empresas con procesos
        sí se filtran por el rango. Un rango invertido (`hasta` < `desde`) responde 422.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Indicadores de gestión del empleo.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Indicadores de gestión del empleo.
                  data:
                    $ref: '#/components/schemas/DashboardAdmin'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — ofertas
  # ---------------------------------------------------------------
  /api/admin/ofertas:
    get:
      tags: [Admin]
      operationId: adminListarOfertas
      summary: Bandeja de ofertas (admin)
      description: |
        Lista todas las ofertas. El estado se valida (422 "Estado de oferta no válido." si
        no está en la lista). Orden por `estado` ASC (alfabético) y luego `created_at DESC`;
        esto NO prioriza las ofertas pendientes. Sin paginación ni límite. Las filas no
        incluyen `habilidades` ni `cantidad_postulaciones`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EstadoOferta'
      responses:
        '200':
          description: Bandeja de ofertas.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Bandeja de ofertas.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfertaFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/ofertas/{id}:
    get:
      tags: [Admin]
      operationId: adminVerOferta
      summary: Detalle de oferta (admin)
      description: |
        Detalle con `habilidades` y `cantidad_postulaciones` (solo postulaciones activas).
        Visible para cualquier estado (borrador incluido).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Detalle de la oferta.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Detalle de la oferta.
                  data:
                    $ref: '#/components/schemas/OfertaDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/actividades:
    get:
      tags: [Admin]
      operationId: adminListarActividades
      summary: Listar actividades (admin)
      description: |
        Filtros `tipo` y `estado` (sin validación de valores). Orden `fecha_inicio DESC`,
        tope fijo 200.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TipoActividad'
        - $ref: '#/components/parameters/EstadoActividad'
      responses:
        '200':
          description: Actividades y eventos.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Actividades y eventos.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actividad'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Admin]
      operationId: adminRegistrarActividad
      summary: Registrar actividad (admin)
      description: |
        Crea una actividad. `estado` no se recibe del cuerpo: nace con el valor por defecto
        de la BD (`programado`). `fecha_inicio`/`fecha_fin` con solo fecha se guardan con
        hora `08:00:00`. `fecha_fin` no puede ser anterior a `fecha_inicio`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActividadBody'
      responses:
        '201':
          description: Actividad registrada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Actividad registrada.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/actividades/{id}:
    put:
      tags: [Admin]
      operationId: adminActualizarActividad
      summary: Actualizar actividad (admin)
      description: |
        Actualiza los campos editables de una actividad (no valida estado previo: una
        actividad finalizada o cancelada puede editarse). No permite cambiar `estado` (use
        el endpoint de estado).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActividadBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/actividades/{id}/estado:
    put:
      tags: [Admin]
      operationId: adminCambiarEstadoActividad
      summary: Cambiar estado de actividad (admin)
      description: |
        Transiciones permitidas (máquina de estados):
        `programado → en_curso | finalizado | cancelado`; `en_curso → finalizado | cancelado`;
        `cancelado → programado`; `finalizado` es terminal. Transición no permitida → 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoActividadBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — oportunidades
  # ---------------------------------------------------------------
  /api/admin/oportunidades:
    get:
      tags: [Admin]
      operationId: adminListarOportunidades
      summary: Listar oportunidades (admin)
      description: |
        Filtros `fuente` y `activo`. `activo` se interpreta con `(int)` (use `0`/`1`).
        `fuente` no se valida (un valor inválido devuelve lista vacía). Orden
        `created_at DESC`, tope fijo 300. Filas con `razon_social` y `ruc` (LEFT JOIN).
      security:
        - bearerAuth: []
      parameters:
        - name: fuente
          in: query
          description: Fuente de la oportunidad (sin validación).
          schema:
            type: string
            enum: [empleos_peru, mype_local, otro]
        - name: activo
          in: query
          description: Filtro por activo (`0` o `1`). Otro valor inválido se castea a 0.
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: Oportunidades de difusión.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Oportunidades de difusión.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Oportunidad'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Admin]
      operationId: adminCrearOportunidad
      summary: Crear oportunidad (admin)
      description: |
        Crea una oportunidad de difusión. El campo `activo` NO se lee del cuerpo: la
        oportunidad nace siempre `activo = 1` (desactívela luego con `/activacion`).
        `empresa_id` opcional pero si se envía debe existir.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OportunidadBody'
      responses:
        '201':
          description: Oportunidad publicada.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Oportunidad publicada.
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/oportunidades/{id}:
    put:
      tags: [Admin]
      operationId: adminActualizarOportunidad
      summary: Actualizar oportunidad (admin)
      description: |
        Mismos campos y validaciones que la creación. La actualización vuelve a forzar
        `activo = 1` (no puede fijar inactiva por este endpoint).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OportunidadBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/oportunidades/{id}/activacion:
    put:
      tags: [Admin]
      operationId: adminCambiarActivacionOportunidad
      summary: Activar/desactivar oportunidad (admin)
      description: |
        Cambia `activo`. **Importante**: el valor se lee con `(bool)`; si el cliente omite
        `activo` o envía la cadena `"false"`, PHP lo interpreta como `true`. Envíe siempre
        booleano nativo. La desactivación conserva el registro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivacionBody'
      responses:
        '200':
          $ref: '#/components/responses/OkVacio200'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ---------------------------------------------------------------
  # ADMIN — reportes y contrataciones
  # ---------------------------------------------------------------
  /api/admin/reportes:
    get:
      tags: [Admin]
      operationId: adminReportes
      summary: Reportes de efectividad (JSON)
      description: |
        Combina el dashboard municipal (`indicadores`) con el detalle de contrataciones
        del rango (`contrataciones`, tope fijo 300). `desde`/`hasta` se validan
        (formato `AAAA-MM-DD` y orden correcto; si no, 422).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Reportes de efectividad.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Reportes de efectividad.
                  data:
                    type: object
                    required: [indicadores, contrataciones]
                    properties:
                      indicadores:
                        $ref: '#/components/schemas/DashboardAdmin'
                      contrataciones:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContratacionFila'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/admin/reportes/csv:
    get:
      tags: [Admin]
      operationId: adminReportesCsv
      summary: Exportar reporte CSV
      description: |
        Respuesta NO JSON: `text/csv; charset=UTF-8` con BOM UTF-8, separador `;`,
        `Content-Disposition: attachment; filename="reporte-empleo.csv"`. La validación de
        rango es la misma que en el dashboard. El archivo incluye 11 filas de resumen y el
        detalle de contrataciones del periodo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Archivo CSV del reporte.
          content:
            text/csv:
              schema:
                type: string
              example: |
                "Reporte de efectividad - Sistema de Empleo MDJLO";""
                "Periodo";"2026-09-01 a 2026-09-08"
                "Empresas activas";"1"
                ...
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
