        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fecha_inicio:
          type: string
          description: 'Datetime. Con fecha sola se persiste con hora 08:00:00.'
        fecha_fin:
          type: string
          nullable: true
        lugar:
          type: string
          nullable: true
        modalidad:
          type: string
          nullable: true
          enum: [presencial, virtual, mixta]
        organizador:
          type: string
          nullable: true
        estado:
          type: string
          enum: [programado, en_curso, finalizado, cancelado]
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true

    ActividadBody:
      type: object
      required: [tipo, nombre, fecha_inicio]
      properties:
        tipo:
          type: string
          enum: [feria_empleo, evento, taller, capacitacion]
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
          maxLength: 10000
        lugar:
          type: string
          maxLength: 150
        organizador:
          type: string
          maxLength: 150
        modalidad:
          type: string
          enum: [presencial, virtual, mixta]
        fecha_inicio:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}(:\d{2})?)?$'
          description: Fecha u datetime; solo fecha se guarda con hora 08:00:00.
        fecha_fin:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}(:\d{2})?)?$'
