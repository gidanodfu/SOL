          $ref: '#/components/schemas/ContadorPostulaciones'
        total_postulaciones:
          type: integer
        con_cv:
          type: boolean

  responses:
    OkVacio200:
      description: |
        Operación exitosa. El backend responde HTTP 200 (no 204) con `data: null`
        (helper `sinContenido()`). El `message` varía según la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaDataNull'
          example:
            success: true
            message: Operación exitosa.
            data: null

    NoAutorizado:
      description: |
        No autenticado. Mensajes reales posibles: "Debe iniciar sesión para acceder a este
        recurso." (header faltante), "Su sesión expiró. Inicie sesión nuevamente." (token
        inválido/expirado) o "La cuenta ya no existe en el sistema."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
          example:
            success: false
            message: Debe iniciar sesión para acceder a este recurso.
            errors: []

    Prohibido:
      description: |
        Sin permisos. Mensajes reales: "No tiene permisos para realizar esta operación."
        (rol no permitido por el filtro) o "Su cuenta está inactiva. Contacte a la
        Municipalidad." (usuario desactivado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
          example:
            success: false
            message: No tiene permisos para realizar esta operación.
            errors: []

    NoEncontrado:
      description: |
        Recurso inexistente o (por diseño anti-enumeración) recurso ajeno al contexto de la
        sesión. Mensaje típico: "El recurso solicitado no existe.".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
          example:
            success: false
            message: El recurso solicitado no existe.
            errors: []

    Conflicto:
      description: Conflicto de estado o de regla de negocio (transición no permitida, duplicado, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'

    PeticionInvalida:
      description: Solicitud mal formada (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'

    Validacion:
      description: |
        Error de validación (422). Mensaje típico del Validador: "Hay errores en los datos
        enviados." con `errors` como lista de mensajes por campo. Algunos endpoints usan
        mensajes propios con `errors` de un solo elemento.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
          example:
            success: false
            message: Hay errores en los datos enviados.
            errors: ['El campo Dni es obligatorio.']

    DemasiadasSolicitudes:
      description: |
        Se excedió el límite de solicitudes (429). El backend usa un **token bucket**
        (Throttler de CI4): ráfaga inicial = capacidad y luego 1 token cada
        `segundos / capacidad`. Aplica a:
        `POST /api/auth/login` (capacidad 5, 1 token/60 s por IP+usuario; solo fallos),
        `POST /api/auth/refresh`, `POST /api/auth/google` y `POST /api/registro/postulante`
        (capacidad 10, 1 token/30 s por IP) y `POST /api/postulante/cv`
        (capacidad 10, 1 token/360 s por IP). Incluye la cabecera `Retry-After` con los
        segundos hasta el siguiente token disponible (≈ 60 s en login).
      headers:
        Retry-After:
          description: Segundos hasta que se permita un nuevo intento.
          schema:
            type: integer
            example: 59
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
          example:
            success: false
            message: Demasiados intentos de inicio de sesión. Intente nuevamente en 59 segundos.
            errors: []

    ErrorInterno:
      description: |
        Error no controlado (500). `ApiExceptionHandler` responde siempre un mensaje
        genérico ("Ocurrió un error inesperado. Intente nuevamente.") sin exponer SQL,
        rutas, stack traces ni detalles de excepción; el detalle se registra solo en el
        log del backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
          example:
            success: false
            message: Ocurrió un error inesperado. Intente nuevamente.
            errors: []
